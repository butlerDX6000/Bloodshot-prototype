<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloodShot</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

#game {
  width: 100vw;
  height: 100vh;
}

#hud {
  position: fixed;
  top: 20px;
  left: 20px;
  color: #ff263b;
  font-weight: bold;
  letter-spacing: 2px;
  pointer-events: none;
}

#message {
  position: fixed;
  bottom: 20px;
  width: 100%;
  text-align: center;
  color: #aaa;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="game"></div>
<div id="hud">BLOODSHOT | ARENA 001</div>
<div id="message">3D ARENA INITIALIZING...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101014);
scene.fog = new THREE.Fog(0x101014, 15, 90);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 2, 8);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.getElementById("game").appendChild(renderer.domElement);

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const redLight = new THREE.PointLight(0xff001e, 8, 35);
redLight.position.set(0, 8, 0);
scene.add(redLight);

// Materials
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x292929,
  roughness: 0.9
});

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0x17171c,
  roughness: 0.8
});

// Floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  floorMaterial
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// Grid
const grid = new THREE.GridHelper(100, 50, 0x880018, 0x383838);
grid.position.y = 0.02;
scene.add(grid);

// Arena walls
function createWall(x, y, z, width, height, depth) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    wallMaterial
  );

  wall.position.set(x, y, z);
  scene.add(wall);
}

createWall(0, 5, -25, 50, 10, 2);
createWall(0, 5, 25, 50, 10, 2);
createWall(-25, 5, 0, 2, 10, 50);
createWall(25, 5, 0, 2, 10, 50);

// Arena pillars
for (let x = -15; x <= 15; x += 10) {
  for (let z = -15; z <= 15; z += 10) {
    if (x === 0 && z === 0) continue;

    const pillar = new THREE.Mesh(
      new THREE.BoxGeometry(2, 7, 2),
      wallMaterial
    );

    pillar.position.set(x, 3.5, z);
    scene.add(pillar);
  }
}

// Camera starting position
camera.position.set(0, 2, 12);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById("message").textContent =
  "ARENA 001 | ENVIRONMENT ONLINE";
</script>

</body>
</html>
